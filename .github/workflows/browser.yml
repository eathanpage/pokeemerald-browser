name: Browser port

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12

      - name: Build
        run: make -f port/wasm.mk -j$(nproc)

      - name: Smoke test
        run: node port/tools/play.mjs -e "wait 300; press START; wait 400; press START; wait 300; shot title" shots
